<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprint Camp 2026</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="header-logos">
            <img src="logo/logo-hmti.png" alt="Logo Kiri" class="logo-img">
            <img src="logo/logo-bisdi.png" alt="Logo Kanan" class="logo-img">
        </div>

        <h1>Twibbon Sprint Camp 2026</h1>
        <p class="subtitle">Pilih bingkai, upload fotomu, dan download hasilnya</p>

        <div class="frame-selector" id="frameSelector">
            <div class="frame-item active" data-src="img_twibbon/HACKER.webp">
                <img src="img_twibbon/HACKER.webp" alt="Bingkai Hacker" class="thumb-frame">
                <span class="frame-label">Hacker</span>
            </div>
            
            <div class="frame-item" data-src="img_twibbon/HIPSTER.webp">
                <img src="img_twibbon/HIPSTER.webp" alt="Bingkai Hipster" class="thumb-frame">
                <span class="frame-label">Hipster</span>
            </div>
            
            <div class="frame-item" data-src="img_twibbon/HUSTLER.webp">
                <img src="img_twibbon/HUSTLER.webp" alt="Bingkai Hustler" class="thumb-frame">
                <span class="frame-label">Hustler</span>
            </div>
        </div>

        <div class="preview-container" id="previewContainer">
            <div class="canvas-wrapper" id="canvasWrapper">
                <img id="userPhoto" src="" alt="Foto Anda" class="hidden">
                <img id="twibbonFrame" src="img_twibbon/HACKER.webp" alt="Bingkai Twibbon">
            </div>
        </div>

        <div class="controls">
            <div class="file-input-wrapper">
                <label for="uploadInput" class="btn-primary">Pilih Foto Anda</label>
                <input type="file" id="uploadInput" accept="image/*">
            </div>

            <div class="slider-group hidden" id="zoomControls">
                <label for="zoomSlider">Ukuran Foto:</label>
                <input type="range" id="zoomSlider" min="10" max="200" value="100">
            </div>

            <button id="downloadBtn" class="btn-success hidden">Download Kualitas HD</button>
        </div>
    </div>

    <canvas id="hiddenCanvas" style="display: none;"></canvas>

    <script src="index.js"></script>
</body>
</html>
